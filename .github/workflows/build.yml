name: Build Chomagerie

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build for
        required: true
        default: fabric
        type: choice
        options:
          - fabric
      releaseType:
        description: Release type
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - alpha

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle Release Build
        run: ./gradlew clean build --console=plain

      - name: Prepare release
        id: release
        env:
          RELEASE_TYPE: ${{ inputs.releaseType || 'stable' }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          MC_VERSION=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          MOD_VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          ARCHIVE_NAME=$(sed -n 's/^archives_base_name=//p' gradle.properties | tr -d '\r')
          test -n "$MC_VERSION"
          test -n "$MOD_VERSION"
          JAR="build/libs/${ARCHIVE_NAME}-${MOD_VERSION}.jar"
          test -s "$JAR"
          CHANNEL=release
          case "$MOD_VERSION" in
            *alpha*|*SNAPSHOT*) CHANNEL=alpha ;;
            *beta*|*rc*|*pre*) CHANNEL=beta ;;
          esac
          case "$RELEASE_TYPE" in
            alpha|beta) CHANNEL="$RELEASE_TYPE" ;;
          esac
          PUBLISH=false
          if [[ "$GITHUB_EVENT_NAME" != pull_request && ( "$GITHUB_REF" == refs/heads/master || "$GITHUB_REF" == refs/heads/main ) ]] \
            && [[ "$HEAD_MESSAGE" != *unrelease* ]] \
            && grep -qiE '^\s*#+\s*\[?Release\]?([[:space:]]|$)' CHANGELOG.md; then
            PUBLISH=true
          fi
          {
            echo "minecraft=$MC_VERSION"
            echo "version=$MOD_VERSION"
            echo "jar=$JAR"
            echo "tag=mc${MC_VERSION}-${MOD_VERSION}"
            echo "name=Chomagerie $MOD_VERSION for Minecraft $MC_VERSION Fabric"
            echo "channel=$CHANNEL"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          awk '/^### \[/ { if (seen++) exit } seen' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Chomagerie-Mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Check publication configuration and existing version
        if: steps.release.outputs.publish == 'true'
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
          MOD_VERSION: ${{ steps.release.outputs.version }}
          MC_VERSION: ${{ steps.release.outputs.minecraft }}
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN" || { echo '::error::Missing MODRINTH_API_KEY secret'; exit 1; }
          test -n "$MODRINTH_PROJECT" || { echo '::error::Missing MODRINTH_PROJECT_ID variable'; exit 1; }
          curl --fail --silent --show-error --retry 3 \
            "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT}/version" > build/modrinth-versions.json
          EXISTS=$(jq --arg version "$MOD_VERSION" --arg mc "$MC_VERSION" \
            'any(.[]; .version_number == $version and (.game_versions | index($mc)) != null)' build/modrinth-versions.json)
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_JAR: ${{ steps.release.outputs.jar }}
        run: |
          set -euo pipefail
          PRERELEASE=false
          if [[ "$RELEASE_CHANNEL" != release ]]; then PRERELEASE=true; fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME" \
              --notes-file build/release-notes.md --prerelease="$PRERELEASE"
            gh release upload "$RELEASE_TAG" "$RELEASE_JAR" --clobber
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_NAME" \
              --notes-file build/release-notes.md --target "$GITHUB_SHA" \
              --prerelease="$PRERELEASE" "$RELEASE_JAR"
          fi

      - name: Read release notes
        if: steps.release.outputs.publish == 'true' && steps.modrinth.outputs.exists != 'true'
        id: notes
        run: |
          DELIMITER="CHANGELOG_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "content<<$DELIMITER"
            cat build/release-notes.md
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        if: steps.release.outputs.publish == 'true' && steps.modrinth.outputs.exists != 'true'
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_API_KEY }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          name: ${{ steps.release.outputs.name }}
          version: ${{ steps.release.outputs.version }}
          changelog: ${{ steps.notes.outputs.content }}
          channel: ${{ steps.release.outputs.channel }}
          loaders: fabric
          game-versions: ${{ steps.release.outputs.minecraft }}
          files: ${{ steps.release.outputs.jar }}
          dependencies: |-
            [
              {"project_id":"P7dR8mSH","dependency_type":"required"},
              {"project_id":"GcWjdA9I","dependency_type":"required"},
              {"project_id":"mOgUt4GM","dependency_type":"optional"}
            ]
